name: Android closed testing

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Optional unique Play version code
        required: false
        type: string
      promote_to:
        description: Promote to closed alpha, or upload to internal only
        required: true
        default: alpha
        type: choice
        options: [alpha, none]
      notification_mode:
        description: Render the tester mail only, or send when SMTP is configured
        required: true
        default: dry-run
        type: choice
        options: [dry-run, auto]

permissions:
  contents: read
  actions: read

concurrency:
  group: android-closed-testing-upload
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.6
  FASTLANE_VERSION: 2.228.0
  MOBILE_DIR: apps/mobile
  PACKAGE_NAME: dev.osholt.tideandseek

jobs:
  upload:
    name: Build and upload Android tester release
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: android-internal
    defaults:
      run:
        working-directory: ${{ env.MOBILE_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 50
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install and check release signing materials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          for required in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            if test -z "${!required}"; then
              echo "::error::Missing Android signing secret $required. See docs/android-internal-testing.md." >&2
              exit 1
            fi
          done
          keystore_path="$RUNNER_TEMP/tide-and-seek-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          keytool -list -keystore "$keystore_path" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" >/dev/null
          cat > android/key.properties <<PROPERTIES
          storeFile=$keystore_path
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPERTIES
          echo "KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Resolve build identity
        env:
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
          PROMOTE_TO: ${{ inputs.promote_to }}
        run: |
          set -euo pipefail
          if test -n "${REQUESTED_BUILD_NUMBER:-}"; then
            build_number="$REQUESTED_BUILD_NUMBER"
          else
            pubspec_build="$(sed -n 's/^version:.*+\([0-9][0-9]*\).*/\1/p' pubspec.yaml | head -1)"
            build_number="$((pubspec_build + GITHUB_RUN_NUMBER))"
          fi
          printf '%s' "$build_number" | grep -Eq '^[1-9][0-9]*$'
          destination_track=internal
          if test "$PROMOTE_TO" = alpha; then destination_track=alpha; fi
          "$GITHUB_WORKSPACE/tools/build-identity.sh" pubspec.yaml "$destination_track" "$build_number" | tee -a "$GITHUB_ENV"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

      - name: Build signed App Bundle
        env:
          TESTER_NOTES_URL: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/tester-release-notes.md
          TIDE_AND_SEEK_API_BASE_URL: ${{ vars.TIDE_AND_SEEK_API_BASE_URL }}
          TIDE_AND_SEEK_FIREBASE_API_KEY: ${{ vars.TIDE_AND_SEEK_FIREBASE_API_KEY }}
          TIDE_AND_SEEK_FIREBASE_PROJECT_ID: ${{ vars.TIDE_AND_SEEK_FIREBASE_PROJECT_ID }}
          TIDE_AND_SEEK_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.TIDE_AND_SEEK_FIREBASE_MESSAGING_SENDER_ID }}
          TIDE_AND_SEEK_FIREBASE_ANDROID_APP_ID: ${{ vars.TIDE_AND_SEEK_FIREBASE_ANDROID_APP_ID }}
        run: |
          set -euo pipefail
          if test -z "${TIDE_AND_SEEK_API_BASE_URL:-}"; then
            echo "::warning::No relay URL is configured; this build remains solo/nearby-only and says so."
          fi
          push_enabled=false
          if test -n "${TIDE_AND_SEEK_FIREBASE_API_KEY:-}" && test -n "${TIDE_AND_SEEK_FIREBASE_PROJECT_ID:-}" && test -n "${TIDE_AND_SEEK_FIREBASE_MESSAGING_SENDER_ID:-}" && test -n "${TIDE_AND_SEEK_FIREBASE_ANDROID_APP_ID:-}"; then
            push_enabled=true
          fi
          flutter pub get
          build_args=(
            "--build-name=$TIDE_AND_SEEK_APP_VERSION"
            "--build-number=$TIDE_AND_SEEK_APP_BUILD"
            "--dart-define=TIDE_AND_SEEK_APP_VERSION=$TIDE_AND_SEEK_APP_VERSION"
            "--dart-define=TIDE_AND_SEEK_APP_BUILD=$TIDE_AND_SEEK_APP_BUILD"
            "--dart-define=TIDE_AND_SEEK_DISTRIBUTION_TRACK=$TIDE_AND_SEEK_DISTRIBUTION_TRACK"
            "--dart-define=TIDE_AND_SEEK_BUILD_TIMESTAMP=$TIDE_AND_SEEK_BUILD_TIMESTAMP"
            "--dart-define=TIDE_AND_SEEK_TESTER_NOTES_URL=$TESTER_NOTES_URL"
            "--dart-define=TIDE_AND_SEEK_API_BASE_URL=${TIDE_AND_SEEK_API_BASE_URL:-}"
            "--dart-define=TIDE_AND_SEEK_PUSH_ENABLED=$push_enabled"
            "--dart-define=TIDE_AND_SEEK_FIREBASE_API_KEY=${TIDE_AND_SEEK_FIREBASE_API_KEY:-}"
            "--dart-define=TIDE_AND_SEEK_FIREBASE_PROJECT_ID=${TIDE_AND_SEEK_FIREBASE_PROJECT_ID:-}"
            "--dart-define=TIDE_AND_SEEK_FIREBASE_MESSAGING_SENDER_ID=${TIDE_AND_SEEK_FIREBASE_MESSAGING_SENDER_ID:-}"
            "--dart-define=TIDE_AND_SEEK_FIREBASE_ANDROID_APP_ID=${TIDE_AND_SEEK_FIREBASE_ANDROID_APP_ID:-}"
            "--dart-define=TIDE_AND_SEEK_VOYAGE_DIAGNOSTICS=true"
          )
          flutter build appbundle --release "${build_args[@]}"

      - name: Verify App Bundle signature
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          bundle=build/app/outputs/bundle/release/app-release.aab
          jarsigner -verify "$bundle" >/dev/null
          expected="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
          actual="$(keytool -printcert -jarfile "$bundle" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
          if test -z "$expected" || test "$actual" != "$expected"; then
            echo "::error::The App Bundle is not signed by the configured Play upload key." >&2
            exit 1
          fi

      - name: Validate Play service account secret
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$SERVICE_ACCOUNT_JSON" || {
            echo "::error::Missing GOOGLE_PLAY_SERVICE_ACCOUNT_JSON. See docs/android-internal-testing.md." >&2
            exit 1
          }

      - name: Upload to Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: ${{ env.MOBILE_DIR }}/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Install Fastlane
        if: ${{ success() && inputs.promote_to == 'alpha' }}
        run: |
          gem install fastlane --version "$FASTLANE_VERSION" --no-document --user-install
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"

      - name: Promote to closed alpha testing
        id: promote
        if: ${{ success() && inputs.promote_to == 'alpha' }}
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          json_key_path="$RUNNER_TEMP/play-service-account.json"
          umask 077
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$json_key_path"
          promote_args=(
            "--json_key" "$json_key_path"
            "--package_name" "$PACKAGE_NAME"
            "--track" "internal"
            "--track_promote_to" "alpha"
            "--track_promote_release_status" "completed"
            "--deactivate_on_promote" "false"
            "--version_code" "$BUILD_NUMBER"
          )
          fastlane supply "${promote_args[@]}"

      - name: Collect tester changes
        if: ${{ success() && inputs.promote_to == 'alpha' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          changes_file="$RUNNER_TEMP/tester-changes.md"
          previous_sha="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android-closed-testing.yml --status success --limit 20 --json databaseId,headSha --jq "[.[] | select(.databaseId < $RUN_ID) | .headSha] | first // \"\"" 2>/dev/null | tr -d '"' || true)"
          if test -n "$previous_sha" && git cat-file -e "$previous_sha^{commit}" 2>/dev/null; then
            baseline="the last Android tester build (commit ${previous_sha:0:7})"
            git log --no-merges --pretty='- %s (%h)' "$previous_sha..HEAD" > "$changes_file"
          else
            baseline="the last 20 commits"
            git log --no-merges --max-count=20 --pretty='- %s (%h)' > "$changes_file"
          fi
          echo "TESTER_CHANGES_FILE=$changes_file" >> "$GITHUB_ENV"
          echo "TESTER_CHANGES_BASELINE=$baseline" >> "$GITHUB_ENV"

      - name: Notify the closed tester group
        if: ${{ success() && inputs.promote_to == 'alpha' }}
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TESTER_GROUP: ${{ vars.TIDE_AND_SEEK_ANDROID_TESTER_GROUP }}
          TESTER_NOTIFY_FROM: ${{ vars.TIDE_AND_SEEK_TESTER_NOTIFY_FROM }}
          TESTER_NOTIFY_SMTP_HOST: ${{ vars.TIDE_AND_SEEK_TESTER_NOTIFY_SMTP_HOST }}
          TESTER_NOTIFY_SMTP_PORT: ${{ vars.TIDE_AND_SEEK_TESTER_NOTIFY_SMTP_PORT }}
          TESTER_NOTIFY_SMTP_USERNAME: ${{ secrets.TIDE_AND_SEEK_TESTER_NOTIFY_SMTP_USERNAME }}
          TESTER_NOTIFY_SMTP_PASSWORD: ${{ secrets.TIDE_AND_SEEK_TESTER_NOTIFY_SMTP_PASSWORD }}
        run: |
          notify_args=(
            "--track" "alpha"
            "--app-version" "$TIDE_AND_SEEK_APP_VERSION"
            "--build-number" "$TIDE_AND_SEEK_APP_BUILD"
            "--commit" "$GITHUB_SHA"
            "--repository" "$GITHUB_REPOSITORY"
            "--run-url" "$RUN_URL"
            "--changes-file" "${TESTER_CHANGES_FILE:-}"
            "--changes-baseline" "${TESTER_CHANGES_BASELINE:-}"
            "--recipient" "${TESTER_GROUP:-}"
            "--mode" "${{ inputs.notification_mode }}"
          )
          python3 "$GITHUB_WORKSPACE/tools/tester_notify/notify_testers.py" "${notify_args[@]}"

      - name: Publish release summary
        if: always()
        env:
          PROMOTE_TO: ${{ inputs.promote_to }}
          PROMOTION_OUTCOME: ${{ steps.promote.outcome }}
        run: |
          if test "$PROMOTE_TO" = none; then
            reach='No closed tester has this build; it was uploaded to internal only.'
          elif test "$PROMOTION_OUTCOME" = success; then
            reach='Closed alpha testers can install this build after Play processing.'
          else
            reach="No closed tester has this build; alpha promotion was ${PROMOTION_OUTCOME:-not reached}."
          fi
          {
            printf '# Android tester build %s\n\n' "${TIDE_AND_SEEK_APP_BUILD:-unknown}"
            printf -- '- App version: **%s**\n' "${TIDE_AND_SEEK_APP_VERSION:-unknown}"
            printf -- '- Play version code: **%s**\n' "${TIDE_AND_SEEK_APP_BUILD:-unknown}"
            printf -- '- Stamped track: **%s**\n' "${TIDE_AND_SEEK_DISTRIBUTION_TRACK:-unknown}"
            printf -- '- Commit: **%s**\n\n' "$GITHUB_SHA"
            printf '%s\n' "$reach"
          } >> "$GITHUB_STEP_SUMMARY"

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tide-and-seek-android-app-bundle
          path: ${{ env.MOBILE_DIR }}/build/app/outputs/bundle/release/*.aab
          if-no-files-found: ignore
