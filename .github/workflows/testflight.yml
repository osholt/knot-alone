name: TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number to use. Defaults to the next one App Store Connect has free.'
        required: false
        type: string
      submit_external:
        description: Assign the build to external testers and submit it for beta review
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: testflight-upload
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.6
  MOBILE_DIR: apps/mobile
  BUNDLE_ID: dev.osholt.tideandseek

jobs:
  upload:
    name: Build and upload iOS beta
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install signing materials
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CI_KEYCHAIN_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_APPSTORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          for required in CERTIFICATE_BASE64 CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD PROFILE_BASE64; do
            if [ -z "${!required}" ]; then
              echo "::error::Missing secret $required. See docs/testflight.md." >&2
              exit 1
            fi
          done
          certificate="$RUNNER_TEMP/distribution.p12"
          profile="$RUNNER_TEMP/appstore.mobileprovision"
          keychain="$RUNNER_TEMP/tide-and-seek.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$profile"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$keychain" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$keychain"

          profile_plist="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$profile" > "$profile_plist"
          profile_name="$(plutil -extract Name raw "$profile_plist")"
          profile_uuid="$(plutil -extract UUID raw "$profile_plist")"
          app_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"
          if [ "$app_identifier" != "UY4624PH6X.$BUNDLE_ID" ]; then
            echo "::error::The provisioning profile belongs to $app_identifier, not UY4624PH6X.$BUNDLE_ID." >&2
            exit 1
          fi
          profile_domains="$(/usr/libexec/PlistBuddy \
            -c 'Print :Entitlements:com.apple.developer.associated-domains' \
            "$profile_plist" 2>/dev/null || true)"
          # Apple represents the enabled Associated Domains capability as `*`
          # in current App Store profiles. The signed app entitlement below is
          # still checked for the exact Tide and Seek applinks hostname.
          if ! grep -Eq '(^|[[:space:]])(\*|applinks:tide-and-seek\.tailendcharlie\.app)([[:space:]]|$)' \
            <<<"$profile_domains"; then
            echo "::error::The provisioning profile must enable Associated Domains." >&2
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          echo "PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"

          code_sign_identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -nE 's/.*"(Apple Distribution|iPhone Distribution):[^"]*".*/\1/p' \
            | head -1)"
          if [ -z "$code_sign_identity" ]; then
            echo "::error::The imported certificate is not an Apple or iPhone Distribution certificate." >&2
            exit 1
          fi
          echo "CODE_SIGN_IDENTITY=$code_sign_identity" >> "$GITHUB_ENV"

      - name: Resolve build number
        env:
          APPSTORE_CONNECT_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          APPSTORE_CONNECT_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
          APPSTORE_CONNECT_API_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_API_PRIVATE_KEY_BASE64 }}
          REQUESTED: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          for required in APPSTORE_CONNECT_API_KEY_ID APPSTORE_CONNECT_API_ISSUER_ID APPSTORE_CONNECT_API_PRIVATE_KEY_BASE64; do
            test -n "${!required}" || { echo "::error::Missing $required." >&2; exit 1; }
          done
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APPSTORE_CONNECT_API_PRIVATE_KEY_BASE64" | base64 -D \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_$APPSTORE_CONNECT_API_KEY_ID.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$APPSTORE_CONNECT_API_KEY_ID.p8"
          if [ -n "$REQUESTED" ]; then
            printf '%s' "$REQUESTED" | grep -Eq '^[1-9][0-9]*$'
            echo "BUILD_NUMBER=$REQUESTED" >> "$GITHUB_ENV"
            exit 0
          fi
          venv="$RUNNER_TEMP/testflight-build-number-venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --quiet --disable-pip-version-check cryptography
          number="$("$venv/bin/python" tools/testflight/next_build_number.py "$BUNDLE_ID")"
          echo "BUILD_NUMBER=$number" >> "$GITHUB_ENV"

      - name: Build App Store IPA
        working-directory: ${{ env.MOBILE_DIR }}
        env:
          TESTER_NOTES_URL: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/tester-release-notes.md
          TESTFLIGHT_INVITE_URL: ${{ vars.TIDE_AND_SEEK_TESTFLIGHT_INVITE_URL }}
          TIDE_AND_SEEK_API_BASE_URL: ${{ vars.TIDE_AND_SEEK_API_BASE_URL }}
          TIDE_AND_SEEK_FIREBASE_IOS_APP_ID: ${{ vars.TIDE_AND_SEEK_FIREBASE_IOS_APP_ID }}
        run: |
          set -euo pipefail
          eval "$("$GITHUB_WORKSPACE/tools/build-identity.sh" pubspec.yaml testflight "$BUILD_NUMBER" | sed 's/^/export /')"
          push_enabled=false
          if test -n "${TIDE_AND_SEEK_FIREBASE_IOS_APP_ID:-}"; then push_enabled=true; fi
          flutter pub get
          flutter build ios --release --no-codesign \
            --build-name="$TIDE_AND_SEEK_APP_VERSION" \
            --build-number="$TIDE_AND_SEEK_APP_BUILD" \
            --dart-define=TIDE_AND_SEEK_APP_VERSION="$TIDE_AND_SEEK_APP_VERSION" \
            --dart-define=TIDE_AND_SEEK_APP_BUILD="$TIDE_AND_SEEK_APP_BUILD" \
            --dart-define=TIDE_AND_SEEK_DISTRIBUTION_TRACK="$TIDE_AND_SEEK_DISTRIBUTION_TRACK" \
            --dart-define=TIDE_AND_SEEK_BUILD_TIMESTAMP="$TIDE_AND_SEEK_BUILD_TIMESTAMP" \
            --dart-define=TIDE_AND_SEEK_TESTER_NOTES_URL="$TESTER_NOTES_URL" \
            --dart-define=TIDE_AND_SEEK_TESTER_UPDATE_URL="${TESTFLIGHT_INVITE_URL:-https://testflight.apple.com/}" \
            --dart-define=TIDE_AND_SEEK_API_BASE_URL="${TIDE_AND_SEEK_API_BASE_URL:-}" \
            --dart-define=TIDE_AND_SEEK_PUSH_ENABLED="$push_enabled" \
            --dart-define=TIDE_AND_SEEK_FIREBASE_IOS_APP_ID="${TIDE_AND_SEEK_FIREBASE_IOS_APP_ID:-}" \
            --dart-define=TIDE_AND_SEEK_VOYAGE_DIAGNOSTICS=true

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            DEVELOPMENT_TEAM="UY4624PH6X" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            TIDE_AND_SEEK_PROFILE_NAME="$PROFILE_NAME" \
            archive

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>UY4624PH6X</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/ios/archive/Runner.xcarchive" \
            -exportPath "$PWD/build/ios/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Verify signed app links and build identity
        working-directory: ${{ env.MOBILE_DIR }}
        run: |
          set -euo pipefail
          ipa="$(ls -t build/ios/ipa/*.ipa | head -1)"
          work="$(mktemp -d)"
          unzip -q "$ipa" -d "$work"
          app="$(ls -d "$work"/Payload/*.app)"
          entitlements="$(codesign -d --entitlements :- "$app" 2>/dev/null)"
          grep -q 'applinks:tide-and-seek.tailendcharlie.app' <<<"$entitlements" || {
            echo "::error::The IPA has no Tide and Seek applinks entitlement." >&2
            exit 1
          }
          codesign -dv --verbose=2 "$app" 2>&1 \
            | grep -Eq "Authority=(Apple Distribution|iPhone Distribution)"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist")" = "$BUILD_NUMBER"

      - name: Upload to TestFlight
        working-directory: ${{ env.MOBILE_DIR }}
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          ipa="$(ls -t build/ios/ipa/*.ipa | head -1)"
          log="$(mktemp)"
          for attempt in 1 2; do
            set +e
            xcrun altool --upload-app -f "$ipa" -t ios \
              --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID" 2>&1 | tee "$log"
            status="${PIPESTATUS[0]}"
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if grep -Eq "previousBundleVersion[[:space:]]*:[[:space:]]*$BUILD_NUMBER([[:space:]]|$)" "$log"; then exit 0; fi
            if [ "$attempt" -eq 1 ] && grep -Eq "status code 5[0-9]{2}|STATE_ERROR\.UPDATING|try again later" "$log"; then
              sleep 90
              continue
            fi
            exit "$status"
          done

      - name: Submit to external TestFlight review
        if: ${{ inputs.submit_external }}
        env:
          EXTERNAL_TESTER_GROUP: ${{ vars.TIDE_AND_SEEK_IOS_EXTERNAL_TESTER_GROUP }}
          REVIEW_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_REVIEW_API_KEY_ID }}
          REVIEW_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_REVIEW_API_ISSUER_ID }}
          REVIEW_API_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_REVIEW_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$EXTERNAL_TESTER_GROUP" || { echo "::error::Set TIDE_AND_SEEK_IOS_EXTERNAL_TESTER_GROUP." >&2; exit 1; }
          for required in REVIEW_API_KEY_ID REVIEW_API_ISSUER_ID REVIEW_API_PRIVATE_KEY_BASE64; do
            test -n "${!required}" || { echo "::error::Missing $required." >&2; exit 1; }
          done
          key="$RUNNER_TEMP/AuthKey_$REVIEW_API_KEY_ID.p8"
          printf '%s' "$REVIEW_API_PRIVATE_KEY_BASE64" | base64 -D > "$key"
          chmod 600 "$key"
          venv="$RUNNER_TEMP/testflight-review-venv"
          python3 -m venv "$venv"
          "$venv/bin/python" -m pip install --quiet "PyJWT[crypto]==2.10.1"
          "$venv/bin/python" tools/testflight/submit_external.py \
            --bundle-id "$BUNDLE_ID" \
            --build-number "$BUILD_NUMBER" \
            --group "$EXTERNAL_TESTER_GROUP" \
            --issuer-id "$REVIEW_API_ISSUER_ID" \
            --key-id "$REVIEW_API_KEY_ID" \
            --private-key "$key"

      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tide-and-seek-ios-app-store-ipa
          path: ${{ env.MOBILE_DIR }}/build/ios/ipa/*.ipa
          if-no-files-found: ignore
