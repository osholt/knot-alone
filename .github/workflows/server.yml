name: Server CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVER_DIR: apps/server

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.SERVER_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          working-directory: ${{ env.SERVER_DIR }}
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Audit Python dependencies
        # The relay itself is an editable local package, not a PyPI dependency.
        # Vulnerabilities still fail the command; only that local package is skipped.
        run: uv run pip-audit --skip-editable
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      # tools/release and tools/testflight talk to App Store Connect and were
      # neither linted nor tested here, which is how a release path grew that
      # only one shell history knew (#42).
      - run: uv run ruff format --check ../../tools/discovery ../../tools/tester_notify ../../tools/release ../../tools/testflight
      - run: uv run ruff check ../../tools/discovery ../../tools/tester_notify ../../tools/release ../../tools/testflight
      - run: cd ../.. && python3 -m unittest discover -s tools/discovery/tests -v
      - run: cd ../.. && python3 -m unittest discover -s tools/tester_notify/tests -v
      - run: cd ../.. && python3 -m unittest discover -s tools/release/tests -v
      - run: cd ../.. && python3 -m unittest discover -s tools/testflight -p 'test_*.py' -v
      - run: cd ../.. && bash -n tools/release/release.sh
      - run: uv run pytest --cov=tide_and_seek_server --cov-report=term-missing --cov-fail-under=80

  postgres-migration:
    name: PostgreSQL migration smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tide_and_seek
          POSTGRES_USER: tide_and_seek
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tide_and_seek -d tide_and_seek"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ${{ env.SERVER_DIR }}
    env:
      TIDE_AND_SEEK_DATABASE_URL: postgresql+psycopg://tide_and_seek:ci-only-password@127.0.0.1:5432/tide_and_seek
      TIDE_AND_SEEK_DATA_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
      TIDE_AND_SEEK_CURSOR_SIGNING_KEY: CwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          working-directory: ${{ env.SERVER_DIR }}
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - run: uv run alembic upgrade head
      - run: uv run python -c "from sqlalchemy import create_engine, inspect; from tide_and_seek_server.config import get_settings; assert {'voyages', 'voyage_events', 'voyage_members', 'idempotency_replays', 'voyage_plans', 'discovery_suggestions', 'discovery_moderation_events', 'discovery_features', 'discovery_road_ratings'} <= set(inspect(create_engine(get_settings().database_url)).get_table_names())"

  container:
    name: Container build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build --tag tide-and-seek-server:ci apps/server
      - name: Validate tailnet deployment
        env:
          POSTGRES_PASSWORD: ci-only-password
          TIDE_AND_SEEK_CURSOR_SIGNING_KEY: CwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCws
          TIDE_AND_SEEK_DATA_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
          TIDE_AND_SEEK_DOMAIN: tide-and-seek.example.ts.net
        run: >-
          docker compose
          --file deploy/compose.yaml
          --file deploy/compose.tailnet.yaml
          config --quiet
      - name: Validate isolated pre-production deployment
        env:
          POSTGRES_PASSWORD: production-ci-only-password
          TIDE_AND_SEEK_CURSOR_SIGNING_KEY: CwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCws
          TIDE_AND_SEEK_DATA_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
          TIDE_AND_SEEK_DOMAIN: relay.example.com
          TIDE_AND_SEEK_PREPRODUCTION_DOMAIN: preprod-relay.example.com
          PREPRODUCTION_POSTGRES_PASSWORD: preproduction-ci-only-password
          PREPRODUCTION_TIDE_AND_SEEK_CURSOR_SIGNING_KEY: DQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0
          PREPRODUCTION_TIDE_AND_SEEK_DATA_ENCRYPTION_KEY: Dg4ODg4ODg4ODg4ODg4ODg4ODg4ODg4ODg4ODg4ODg4
        run: |
          docker compose --file deploy/compose.preproduction.yaml config --quiet
          docker compose \
            --file deploy/compose.yaml \
            --file deploy/compose.preproduction-proxy.yaml \
            config --quiet
          docker run --rm \
            --env TIDE_AND_SEEK_DOMAIN \
            --env TIDE_AND_SEEK_PREPRODUCTION_DOMAIN \
            --volume "$PWD/deploy/Caddyfile.preproduction:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile
