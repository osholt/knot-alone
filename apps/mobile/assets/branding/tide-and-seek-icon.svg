<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Tide and Seek app icon</title>
  <!--
    Keeps the inherited relay composition: a large hero vessel low and left, a
    smaller follower high and right, two chevrons carrying the eye between them.

    Every shape is outlined in the field colour, which is how the original
    motorcycle mark kept adjacent same-fill shapes legible. Without it the
    mainsail, genoa and hull fuse into one silhouette and the rig disappears.
  -->
  <defs>
    <style>
      .field  { fill: #0C6B4F; }
      .hero   { fill: #FDF6E3; stroke: #0C6B4F; stroke-width: 17;
                stroke-linejoin: round; }
      .follow { fill: #9FD2BE; stroke: #0C6B4F; stroke-width: 15;
                stroke-linejoin: round; }
      .plain  { stroke: none; }
      .arrow  { fill: none; stroke: #F5C542; stroke-width: 32;
                stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="field" width="1024" height="1024"/>

  <!-- Follower: flybridge motor cruiser, upper right. -->
  <g class="follow" transform="rotate(-4 830 430)">
    <path d="M 712 424 C 796 410 884 402 962 402 C 952 448 916 474 862 478
             L 782 476 C 738 470 724 450 712 424 Z"/>
    <path d="M 750 366 L 866 360 L 888 400 L 744 406 Z"/>
    <path d="M 786 328 L 852 324 L 862 356 L 782 360 Z"/>
    <rect class="plain" x="812" y="292" width="15" height="38" rx="7"
          fill="#9FD2BE"/>
  </g>
  <g class="plain" fill="#9FD2BE">
    <rect x="646" y="470" width="50" height="16" rx="8"/>
    <rect x="588" y="498" width="34" height="14" rx="7"/>
  </g>

  <!-- Two chevrons, hero to follower. -->
  <g class="arrow">
    <path d="M 452 286 L 508 330 L 452 374"/>
    <path d="M 534 286 L 590 330 L 534 374"/>
  </g>

  <!-- Hero: masthead sloop, lower left, bow to the right. -->
  <g class="hero" transform="rotate(-4 380 780)">
    <!-- mainsail, aft of the mast -->
    <path d="M 286 300 L 296 700 L 138 692 C 186 556 234 424 286 300 Z"/>
    <!-- genoa, forward of the mast, clew sheeted aft of the shrouds -->
    <path d="M 300 316 L 566 700 L 322 700 Z"/>
    <!-- mast -->
    <path d="M 280 292 L 300 292 L 306 716 L 288 716 Z"/>
    <!-- boom -->
    <rect x="134" y="700" width="180" height="20" rx="10"/>
    <!-- coachroof -->
    <path d="M 244 736 L 424 730 L 438 770 L 232 776 Z"/>
    <!-- hull: plumb bow right, reverse transom left -->
    <path d="M 110 794 C 282 772 470 762 654 770 C 638 838 556 880 434 886
             L 282 882 C 184 874 134 840 110 794 Z"/>
    <!-- fin keel -->
    <path d="M 336 880 L 442 882 L 418 972 L 366 972 Z"/>
  </g>
</svg>
