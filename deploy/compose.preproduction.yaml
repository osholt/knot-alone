name: tide-and-seek-preproduction

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tide_and_seek
      POSTGRES_USER: tide_and_seek
      POSTGRES_PASSWORD: ${PREPRODUCTION_POSTGRES_PASSWORD:?set PREPRODUCTION_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U tide_and_seek -d tide_and_seek]
      interval: 5s
      timeout: 5s
      retries: 12

  # Keep this service name distinct from production's `server`. Docker adds
  # the Compose service name as a DNS alias on every attached network; using
  # `server` here would make the production proxy randomly resolve either API.
  preproduction-server:
    build:
      context: ../apps/server
      args:
        TIDE_AND_SEEK_BUILD_COMMIT: ${TIDE_AND_SEEK_BUILD_COMMIT:-unknown}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment: &server-environment
      TIDE_AND_SEEK_ENVIRONMENT: preproduction
      TIDE_AND_SEEK_DATABASE_URL: postgresql+psycopg://tide_and_seek:${PREPRODUCTION_POSTGRES_PASSWORD}@db:5432/tide_and_seek
      TIDE_AND_SEEK_DATA_ENCRYPTION_KEY: ${PREPRODUCTION_TIDE_AND_SEEK_DATA_ENCRYPTION_KEY:?set PREPRODUCTION_TIDE_AND_SEEK_DATA_ENCRYPTION_KEY}
      TIDE_AND_SEEK_CURSOR_SIGNING_KEY: ${PREPRODUCTION_TIDE_AND_SEEK_CURSOR_SIGNING_KEY:?set PREPRODUCTION_TIDE_AND_SEEK_CURSOR_SIGNING_KEY}
      TIDE_AND_SEEK_APNS_TEAM_ID: ${PREPRODUCTION_TIDE_AND_SEEK_APNS_TEAM_ID:-}
      TIDE_AND_SEEK_APNS_KEY_ID: ${PREPRODUCTION_TIDE_AND_SEEK_APNS_KEY_ID:-}
      TIDE_AND_SEEK_APNS_BUNDLE_ID: ${PREPRODUCTION_TIDE_AND_SEEK_APNS_BUNDLE_ID:-}
      TIDE_AND_SEEK_APNS_PRIVATE_KEY_BASE64: ${PREPRODUCTION_TIDE_AND_SEEK_APNS_PRIVATE_KEY_BASE64:-}
      TIDE_AND_SEEK_APNS_SANDBOX: ${PREPRODUCTION_TIDE_AND_SEEK_APNS_SANDBOX:-true}
      TIDE_AND_SEEK_FCM_PROJECT_ID: ${PREPRODUCTION_TIDE_AND_SEEK_FCM_PROJECT_ID:-}
      TIDE_AND_SEEK_FCM_CLIENT_EMAIL: ${PREPRODUCTION_TIDE_AND_SEEK_FCM_CLIENT_EMAIL:-}
      TIDE_AND_SEEK_FCM_PRIVATE_KEY_BASE64: ${PREPRODUCTION_TIDE_AND_SEEK_FCM_PRIVATE_KEY_BASE64:-}
      TIDE_AND_SEEK_PUSH_DELIVERY_TIMEOUT_SECONDS: ${PREPRODUCTION_TIDE_AND_SEEK_PUSH_DELIVERY_TIMEOUT_SECONDS:-8}
      TIDE_AND_SEEK_DISCOVERY_ADMIN_TOKEN: ${PREPRODUCTION_TIDE_AND_SEEK_DISCOVERY_ADMIN_TOKEN:-}
      TIDE_AND_SEEK_DISCOVERY_ADMIN_NAME: ${PREPRODUCTION_TIDE_AND_SEEK_DISCOVERY_ADMIN_NAME:-preproduction-discovery-admin}
      TIDE_AND_SEEK_DISCOVERY_ALLOWED_ORIGINS: '["https://tideandseek.invalid","https://www.tideandseek.invalid"]'
      TIDE_AND_SEEK_TRUSTED_HOSTS: '["${TIDE_AND_SEEK_PREPRODUCTION_DOMAIN}","127.0.0.1","localhost"]'
      TIDE_AND_SEEK_FORWARDED_ALLOW_IPS: '*'
      TIDE_AND_SEEK_AUTO_CREATE_SCHEMA: 'false'
      TIDE_AND_SEEK_VOYAGE_RETENTION_HOURS: 72
      TIDE_AND_SEEK_ENDED_VOYAGE_GRACE_HOURS: 24
      TIDE_AND_SEEK_JOIN_CODE_LOOKUP_RATE_LIMIT_REQUESTS: 30
      TIDE_AND_SEEK_JOIN_CODE_LOOKUP_RATE_LIMIT_WINDOW_SECONDS: 60
      TIDE_AND_SEEK_JOIN_CODE_GLOBAL_RATE_LIMIT_REQUESTS: 20
      TIDE_AND_SEEK_MAXIMUM_ACTIVE_VOYAGES: ${PREPRODUCTION_TIDE_AND_SEEK_MAXIMUM_ACTIVE_VOYAGES:-25}
      TIDE_AND_SEEK_MAXIMUM_EVENTS_PER_VOYAGE: ${PREPRODUCTION_TIDE_AND_SEEK_MAXIMUM_EVENTS_PER_VOYAGE:-2500}
      TIDE_AND_SEEK_MAXIMUM_STORED_BYTES_PER_VOYAGE: ${PREPRODUCTION_TIDE_AND_SEEK_MAXIMUM_STORED_BYTES_PER_VOYAGE:-13107200}
      TIDE_AND_SEEK_MAXIMUM_REPLAYS_PER_VOYAGE: ${PREPRODUCTION_TIDE_AND_SEEK_MAXIMUM_REPLAYS_PER_VOYAGE:-2500}
      TIDE_AND_SEEK_MAXIMUM_REPLAY_BYTES_PER_VOYAGE: ${PREPRODUCTION_TIDE_AND_SEEK_MAXIMUM_REPLAY_BYTES_PER_VOYAGE:-13107200}
      TIDE_AND_SEEK_TOMTOM_TRAFFIC_API_KEY: ${PREPRODUCTION_TIDE_AND_SEEK_TOMTOM_TRAFFIC_API_KEY:-}
      TIDE_AND_SEEK_TRAFFIC_PROVIDER_TIMEOUT_SECONDS: ${PREPRODUCTION_TIDE_AND_SEEK_TRAFFIC_PROVIDER_TIMEOUT_SECONDS:-8}
      TIDE_AND_SEEK_TRAFFIC_INCIDENT_CACHE_SECONDS: ${PREPRODUCTION_TIDE_AND_SEEK_TRAFFIC_INCIDENT_CACHE_SECONDS:-60}
      TIDE_AND_SEEK_TRAFFIC_INCIDENT_RATE_LIMIT_REQUESTS: ${PREPRODUCTION_TIDE_AND_SEEK_TRAFFIC_INCIDENT_RATE_LIMIT_REQUESTS:-60}
      TIDE_AND_SEEK_TRAFFIC_INCIDENT_RATE_LIMIT_WINDOW_SECONDS: ${PREPRODUCTION_TIDE_AND_SEEK_TRAFFIC_INCIDENT_RATE_LIMIT_WINDOW_SECONDS:-60}
      TIDE_AND_SEEK_TRAFFIC_INCIDENT_MAXIMUM_RESPONSE_BYTES: ${PREPRODUCTION_TIDE_AND_SEEK_TRAFFIC_INCIDENT_MAXIMUM_RESPONSE_BYTES:-524288}
      TIDE_AND_SEEK_OBSERVER_READ_RATE_LIMIT_REQUESTS: ${PREPRODUCTION_TIDE_AND_SEEK_OBSERVER_READ_RATE_LIMIT_REQUESTS:-120}
      TIDE_AND_SEEK_OBSERVER_READ_RATE_LIMIT_WINDOW_SECONDS: ${PREPRODUCTION_TIDE_AND_SEEK_OBSERVER_READ_RATE_LIMIT_WINDOW_SECONDS:-60}
      TIDE_AND_SEEK_OBSERVER_IP_ABUSE_RATE_LIMIT_REQUESTS: ${PREPRODUCTION_TIDE_AND_SEEK_OBSERVER_IP_ABUSE_RATE_LIMIT_REQUESTS:-5000}
      TIDE_AND_SEEK_OBSERVER_CREATE_RATE_LIMIT_REQUESTS: ${PREPRODUCTION_TIDE_AND_SEEK_OBSERVER_CREATE_RATE_LIMIT_REQUESTS:-10}
      TIDE_AND_SEEK_OBSERVER_CREATE_IP_ABUSE_RATE_LIMIT_REQUESTS: ${PREPRODUCTION_TIDE_AND_SEEK_OBSERVER_CREATE_IP_ABUSE_RATE_LIMIT_REQUESTS:-500}
      TIDE_AND_SEEK_OBSERVER_CREATE_RATE_LIMIT_WINDOW_SECONDS: ${PREPRODUCTION_TIDE_AND_SEEK_OBSERVER_CREATE_RATE_LIMIT_WINDOW_SECONDS:-3600}
      TIDE_AND_SEEK_MAXIMUM_OBSERVER_GRANTS_PER_VOYAGE: ${PREPRODUCTION_TIDE_AND_SEEK_MAXIMUM_OBSERVER_GRANTS_PER_VOYAGE:-50}
    networks:
      default:
      relay-proxy:
        aliases:
          - preproduction-server
    depends_on:
      db:
        condition: service_healthy

  cleanup:
    build:
      context: ../apps/server
      args:
        TIDE_AND_SEEK_BUILD_COMMIT: ${TIDE_AND_SEEK_BUILD_COMMIT:-unknown}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment: *server-environment
    command:
      - sh
      - -c
      - while true; do .venv/bin/tide-and-seek-cleanup; sleep 3600; done
    healthcheck:
      disable: true
    depends_on:
      preproduction-server:
        condition: service_healthy

networks:
  relay-proxy:
    name: tide-and-seek_default
    external: true

volumes:
  postgres-data:
