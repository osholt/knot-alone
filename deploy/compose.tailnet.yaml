services:
  tailscale:
    image: tailscale/tailscale:v1.98.9
    hostname: ${TIDE_AND_SEEK_TAILSCALE_HOSTNAME:-tide-and-seek}
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${TIDE_AND_SEEK_TAILSCALE_HOSTNAME:-tide-and-seek}
      TS_SERVE_CONFIG: /config/serve.json
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    depends_on:
      server:
        condition: service_healthy

volumes:
  tailscale-state:
